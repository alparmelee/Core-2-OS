<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3.1 Windows Troubleshooting Simulator</title>
<style>
  :root{ --accent:#0078d4; --taskbar-bg:#1f1f1f; --win-bg:#f3f3f3; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif; overflow:auto; }
  body{ background:#202020; }
  .app-root{ position:relative; width:100%; height:100%; overflow:hidden; user-select:none; }
  .desktop{ position:absolute; inset:0; background: linear-gradient(150deg,#0b3d91 0%, #1e6fd9 45%, #56c2e6 100%); transition:filter .3s; }
  .desktop.safemode::after{ content:"Safe Mode"; position:absolute; top:0; left:0; right:0; text-align:center; color:#ffcc00; font-size:11px; padding:2px; background:rgba(0,0,0,0.3); }
  .safe-corner{ position:absolute; color:#ffcc00; font-size:11px; background:rgba(0,0,0,0.4); padding:3px 8px; border-radius:3px; z-index:4000; display:none; }
  .safe-corner.show{ display:block; }

  .taskbar{ position:absolute; left:0; right:0; bottom:0; height:46px; background:var(--taskbar-bg); display:flex; align-items:center; gap:4px; padding:0 8px; z-index:5000; color:#fff; }
  .tb-start{ width:40px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tb-start:hover, .tb-icon:hover, .tb-tray-item:hover{ background:rgba(255,255,255,0.12); }
  .win-grid{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; width:15px; height:15px; }
  .win-grid span{ background:#00adef; }
  .tb-search{ display:flex; align-items:center; gap:8px; background:#2b2b2b; border-radius:18px; padding:6px 14px; width:250px; color:#ccc; font-size:12.5px; }
  .tb-search input{ background:transparent; border:none; outline:none; color:#fff; font-size:12.5px; flex:1; }
  .tb-icon{ width:36px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; }
  .tb-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .tb-tray-item{ font-size:14px; padding:6px 7px; border-radius:4px; cursor:pointer; }
  .tb-clock{ font-size:11.5px; line-height:1.3; text-align:right; padding:4px 10px; border-radius:4px; cursor:pointer; }

  .start-menu{ position:absolute; bottom:52px; left:8px; width:420px; max-height:520px; background:rgba(32,32,32,0.92); backdrop-filter:blur(18px); border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:none; flex-direction:column; z-index:6000; color:#fff; overflow:hidden; }
  .start-menu.open{ display:flex; }
  .sm-search{ padding:14px 16px 8px; }
  .sm-search input{ width:100%; box-sizing:border-box; background:#3a3a3a; border:none; border-radius:6px; padding:8px 12px; color:#fff; font-size:12.5px; outline:none; }
  .sm-heading{ padding:10px 16px 6px; font-size:12px; color:#bbb; }
  .sm-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 12px 12px; overflow-y:auto; }
  .sm-tile{ background:rgba(255,255,255,0.06); border-radius:6px; padding:12px 4px; text-align:center; cursor:pointer; font-size:10px; }
  .sm-tile:hover{ background:rgba(255,255,255,0.14); }
  .sm-tile .sm-glyph{ font-size:19px; display:block; margin-bottom:4px; }
  .sm-footer{ border-top:1px solid rgba(255,255,255,0.12); padding:10px 16px; font-size:12px; display:flex; justify-content:space-between; color:#ccc; }

  .run-dialog{ position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); width:380px; background:#f0f0f0; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:none; z-index:7000; overflow:hidden; border:1px solid #999; }
  .run-dialog.open{ display:block; }
  .run-title{ padding:8px 12px; font-size:13px; font-weight:600; border-bottom:1px solid #ddd; }
  .run-body{ padding:16px; font-size:12.5px; }
  .run-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .run-row input{ flex:1; padding:5px 8px; border:1px solid #999; font-size:12.5px; }
  .run-btns{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .run-btns button{ padding:5px 16px; border:1px solid #888; background:#e8e8e8; border-radius:2px; cursor:pointer; font-size:12px; }

  .win{ position:absolute; background:var(--win-bg); border:1px solid #9a9a9a; box-shadow:0 20px 50px rgba(0,0,0,0.4); display:flex; flex-direction:column; overflow:hidden; min-width:340px; min-height:220px; }
  .win-titlebar{ height:32px; background:#e6e6e6; border-bottom:1px solid #cfcfcf; display:flex; align-items:center; padding:0 0 0 8px; cursor:move; flex-shrink:0; gap:6px; }
  .win-titlebar .wt-title{ font-size:12.5px; color:#222; flex:1; }
  .win-titlebar .wt-btns{ display:flex; height:100%; }
  .win-titlebar .wt-btns div{ width:44px; height:100%; display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; }
  .win-titlebar .wt-btns div:hover{ background:#d7d7d7; }
  .win-titlebar .wt-btns .wt-close:hover{ background:#e81123; color:#fff; }
  .win-content{ flex:1; overflow:auto; font-size:12.5px; background:#fff; }

  .tabbar{ display:flex; background:#eaeaea; border-bottom:1px solid #ccc; flex-shrink:0; flex-wrap:wrap; }
  .tabbar .tab{ padding:8px 14px; font-size:12.5px; cursor:pointer; border-right:1px solid #ddd; color:#333; }
  .tabbar .tab.active{ background:#fff; font-weight:600; border-bottom:2px solid var(--accent); }
  .tabbar .tab:hover{ background:#f5f5f5; }

  table.wtable{ width:100%; border-collapse:collapse; font-size:12px; }
  table.wtable th{ text-align:left; background:#f3f3f3; border-bottom:1px solid #ddd; padding:6px 10px; color:#444; cursor:pointer; }
  table.wtable td{ padding:5px 10px; border-bottom:1px solid #eee; }
  table.wtable tr:hover td{ background:#f2f8ff; }
  table.wtable tr.selected td{ background:#cfe4ff; }
  .status-run{ color:#2fa84f; } .status-stop{ color:#999; } .status-warn{ color:#c98a00; } .status-err{ color:#d13438; }

  .toolbar{ display:flex; gap:6px; padding:6px 10px; background:#f7f7f7; border-bottom:1px solid #e0e0e0; flex-shrink:0; align-items:center; flex-wrap:wrap; }
  .toolbar button{ padding:5px 10px; font-size:12px; border:1px solid #c8c8c8; background:#fff; border-radius:3px; cursor:pointer; }
  .toolbar button:hover{ background:#eef4ff; }
  .toolbar button:disabled{ color:#aaa; cursor:default; background:#f3f3f3; }

  .split{ display:flex; height:100%; }
  .tree-pane{ width:210px; background:#f7f7f7; border-right:1px solid #ddd; overflow-y:auto; padding:6px 0; flex-shrink:0; }
  .tree-node{ padding:6px 10px 6px 16px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .tree-node:hover{ background:#e9f1fb; }
  .tree-node.active{ background:#cfe4ff; font-weight:600; }
  .detail-pane{ flex:1; overflow-y:auto; padding:16px 18px; }
  .detail-pane h3{ margin:0 0 10px; font-size:15px; }
  .kv-row{ display:flex; padding:4px 0; border-bottom:1px solid #f0f0f0; font-size:12px; }
  .kv-row .k{ width:200px; color:#555; }
  .desc-box{ background:#eef6ff; border:1px solid #cfe0f5; padding:10px 12px; border-radius:4px; font-size:12px; margin:12px 0; color:#204060; }
  .warn-box{ background:#fff4ce; border:1px solid #f2c94c; padding:10px 12px; border-radius:4px; font-size:12px; margin-bottom:12px; color:#664d03; }
  .step-list{ margin:8px 0; padding-left:0; list-style:none; }
  .step-list li{ display:flex; align-items:flex-start; gap:8px; padding:6px 0; font-size:12.5px; border-bottom:1px solid #f2f2f2; }
  .step-list li input{ margin-top:3px; }

  .field-row{ display:flex; align-items:center; gap:10px; margin:8px 0; font-size:12.5px; }
  .field-row label{ width:160px; color:#333; }
  .field-row input[type=text], .field-row input[type=number]{ flex:1; padding:5px 7px; border:1px solid #aaa; font-size:12.5px; }
  .field-row input:disabled{ background:#eee; color:#999; }

  .card{ border:1px solid #ddd; border-radius:6px; padding:14px; margin-bottom:12px; background:#fff; }
  .card h4{ margin:0 0 8px; font-size:13px; }
  .toggle{ width:36px; height:20px; border-radius:12px; background:#ccc; position:relative; cursor:pointer; transition:background .15s; display:inline-block; vertical-align:middle; }
  .toggle.on{ background:var(--accent); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on .knob{ left:18px; }

  .progress-track{ height:10px; background:#e2e2e2; border-radius:5px; overflow:hidden; margin:8px 0; }
  .progress-fill{ height:100%; background:var(--accent); width:0%; transition:width .2s; }

  .modal-overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; z-index:20; }
  .modal-box{ background:#fff; border-radius:6px; box-shadow:0 15px 40px rgba(0,0,0,0.4); width:360px; padding:18px; font-size:12.5px; max-height:80%; overflow-y:auto; }
  .modal-box h4{ margin:0 0 10px; }
  .modal-btns{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .modal-btns button{ padding:6px 14px; border:1px solid #999; background:#eee; border-radius:3px; cursor:pointer; font-size:12px; }
  .modal-btns button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }

  /* BSOD */
  .bsod{ position:absolute; inset:0; background:#0078d7; color:#fff; z-index:20000; display:none; flex-direction:column; align-items:center; justify-content:center; font-family:"Segoe UI",Arial,sans-serif; text-align:left; padding:60px; }
  .bsod.show{ display:flex; }
  .bsod .sadface{ font-size:80px; margin-bottom:20px; }
  .bsod .bsod-text{ max-width:640px; font-size:15px; line-height:1.6; }
  .bsod .bsod-progress{ margin:20px 0; font-size:15px; }
  .bsod .bsod-bottom{ display:flex; gap:30px; margin-top:30px; align-items:center; font-size:11px; }
  .bsod .qr{ width:90px; height:90px; background:repeating-conic-gradient(#fff 0% 25%, #0078d7 0% 50%) 0 0/16px 16px; border:6px solid #fff; }

  /* WinRE */
  .winre{ position:absolute; inset:0; background:#0f2a44; color:#fff; z-index:19000; display:none; flex-direction:column; align-items:center; justify-content:center; }
  .winre.show{ display:flex; }
  .winre h2{ font-weight:300; margin-bottom:26px; }
  .winre-grid{ display:grid; grid-template-columns:repeat(3,180px); gap:16px; }
  .winre-tile{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:6px; padding:20px 10px; text-align:center; cursor:pointer; font-size:12.5px; }
  .winre-tile:hover{ background:rgba(255,255,255,0.18); }
  .winre-tile .wr-glyph{ font-size:26px; display:block; margin-bottom:8px; }
  .winre-back{ margin-top:24px; font-size:12px; cursor:pointer; opacity:.8; }
  .winre-back:hover{ opacity:1; }

  /* Recovery command prompt */
  .rcmd{ background:#000; color:#e0e0e0; font-family:Consolas,monospace; font-size:13px; padding:12px; height:100%; overflow-y:auto; white-space:pre-wrap; }
  .rcmd-line{ min-height:1.4em; }
  .rcmd-input-row{ display:flex; }
  .rcmd-cursor{ display:inline-block; width:7px; height:14px; background:#ddd; margin-left:2px; animation:blink 1s step-end infinite; }
  @keyframes blink{ 0%,50%{opacity:1;} 51%,100%{opacity:0;} }

  .toast-wrap{ position:absolute; bottom:56px; right:14px; z-index:21000; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .toast{ background:rgba(20,20,20,0.92); color:#fff; padding:10px 16px; border-radius:4px; font-size:12.5px; max-width:320px; box-shadow:0 10px 25px rgba(0,0,0,.35); animation:toastIn .18s ease; white-space:pre-wrap; }
  @keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .layout{ display:flex; gap:16px; align-items:flex-start; justify-content:center; padding:20px; box-sizing:border-box; min-height:100vh; background:#242424; }
  .sim-nav{ display:flex; flex-wrap:wrap; gap:0.75rem 1.25rem; align-items:center; justify-content:center; padding:14px 20px 0; background:#242424; font-family:"Segoe UI",Tahoma,Arial,sans-serif; font-size:13px; }
  .sim-nav a{ color:#4db3ff; text-decoration:none; font-weight:600; }
  .sim-nav a:hover{ text-decoration:underline; }
  .sim-nav .sep{ color:#666; }
  .screen-frame{ width:1040px; max-width:70%; min-width:660px; height:680px; max-height:82vh; border-radius:10px; overflow:hidden; box-shadow:0 25px 70px rgba(0,0,0,0.5); flex-shrink:0; position:relative; }
  .reference{ width:410px; max-width:100%; height:680px; max-height:82vh; background:#181818; border-radius:10px; box-shadow:0 25px 70px rgba(0,0,0,0.5); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; color:#ddd; }
  .ref-titlebar{ background:#242424; padding:10px 14px; font-size:13px; border-bottom:1px solid #333; display:flex; align-items:center; gap:8px; }
  .ref-titlebar .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .ref-search{ padding:10px 12px; border-bottom:1px solid #2e2e2e; background:#151515; }
  .ref-search input{ width:100%; box-sizing:border-box; background:#0f0f0f; border:1px solid #333; color:#eee; font-size:12.5px; padding:8px 10px; border-radius:5px; outline:none; }
  .ref-search input:focus{ border-color:var(--accent); }
  .ref-list{ flex:1; overflow-y:auto; padding:4px 0 12px; }
  .ref-group{ padding:10px 14px 4px; font-size:11px; color:#777; text-transform:uppercase; letter-spacing:.05em; background:#111; position:sticky; top:0; }
  .ref-item{ padding:11px 14px; border-bottom:1px solid #232323; cursor:pointer; }
  .ref-item:hover{ background:#212121; }
  .ref-item .ref-name{ font-size:13.5px; color:#4db3ff; font-weight:700; }
  .ref-item .ref-action{ font-size:11.5px; color:#f4c95d; margin-top:3px; }
  .ref-item .ref-action::before{ content:"↳ "; color:#666; }
  .ref-item .ref-desc{ font-size:12px; color:#aaa; margin-top:5px; line-height:1.45; }
  .ref-empty{ padding:24px 14px; color:#777; font-size:12.5px; text-align:center; }
  @media (max-width:1120px){
    .layout{ flex-direction:column; }
    .screen-frame, .reference{ width:100%; max-width:100%; height:640px; }
  }
</style>
</head>

<div class="layout">
  <div class="screen-frame">
    <div class="app-root" id="appRoot">
      <div class="desktop" id="desktopEl"></div>
      <div class="safe-corner" id="safeCornerTL" style="top:8px;left:8px;">Safe Mode</div>
      <div class="safe-corner" id="safeCornerBR" style="bottom:56px;right:8px;">Safe Mode</div>

      <div id="windowLayer"></div>

      <div class="start-menu" id="startMenu">
        <div class="sm-search"><input id="smSearchInput" placeholder="Type here to search"></div>
        <div class="sm-heading">Troubleshooting tools</div>
        <div class="sm-grid" id="smGrid"></div>
        <div class="sm-footer">
          <span onclick="Win.toast('Account switching is not simulated here.')">👤 jsmith</span>
          <span onclick="Win.triggerBSOD()" style="color:#ff8a80;">💥 Simulate a crash</span>
        </div>
      </div>

      <div class="run-dialog" id="runDialog">
        <div class="run-title">Run</div>
        <div class="run-body">
          <div class="run-row" style="align-items:flex-start;"><span style="font-size:22px;">🏃</span><div style="flex:1;">Type the name of a program or tool, and Windows will open it for you.</div></div>
          <div class="run-row"><span>Open:</span><input id="runInput" placeholder="e.g. services.msc"></div>
          <div class="run-btns"><button onclick="Win.runExecute()">OK</button><button onclick="Win.runClose()">Cancel</button></div>
        </div>
      </div>

      <div class="toast-wrap" id="toastWrap"></div>

      <div class="bsod" id="bsod"></div>
      <div class="winre" id="winre"></div>

      <div class="taskbar">
        <div class="tb-start" id="startBtn" title="Start"><div class="win-grid"><span></span><span></span><span></span><span></span></div></div>
        <div class="tb-search" id="tbSearchBox">🔍<input id="tbSearchInput" placeholder="Search"></div>
        <div id="tbPinned" style="display:flex;"></div>
        <div class="tb-right">
          <div class="tb-tray-item" title="Windows Security" onclick="Win.openTool('security')">🛡️</div>
          <div class="tb-tray-item" title="Simulate crash" onclick="Win.triggerBSOD()">💥</div>
          <div class="tb-clock" id="tbClock"></div>
        </div>
      </div>
    </div>

  <div class="reference">
    <div class="ref-titlebar"><span class="dot"></span><span>Windows Troubleshooting Index</span></div>

    <div class="ref-list" id="refList"></div>
  </div>

<script>
(function(){
  // ============== Window manager ==============
  const layer = document.getElementById('windowLayer');
  const openWins = {};
  let zTop = 100;
  function focusWin(id){ const w=openWins[id]; if(!w) return; zTop+=1; w.el.style.zIndex=zTop; }
  function closeWin(id){ const w=openWins[id]; if(!w) return; w.el.remove(); delete openWins[id]; }
  function makeDraggable(winEl, handleEl){
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    handleEl.addEventListener('mousedown', e=>{
      if(e.target.closest('.wt-btns')) return;
      dragging=true; sx=e.clientX; sy=e.clientY;
      const rect = winEl.getBoundingClientRect();
      const parentRect = winEl.parentElement.getBoundingClientRect();
      ox = rect.left-parentRect.left; oy = rect.top-parentRect.top;
      zTop+=1; winEl.style.zIndex=zTop;
    });
    window.addEventListener('mousemove', e=>{
      if(!dragging) return;
      winEl.style.left = (ox+(e.clientX-sx))+'px';
      winEl.style.top = (oy+(e.clientY-sy))+'px';
    });
    window.addEventListener('mouseup', ()=> dragging=false);
  }
  function createWindow(id, opts){
    if(openWins[id]){ focusWin(id); openWins[id].el.style.display='flex'; if(opts.onFocus) opts.onFocus(); return openWins[id].el; }
    const el = document.createElement('div');
    el.className = 'win';
    el.style.width = (opts.width||560)+'px';
    el.style.height = (opts.height||400)+'px';
    el.style.left = (opts.x!==undefined?opts.x:(50+Object.keys(openWins).length*22))+'px';
    el.style.top = (opts.y!==undefined?opts.y:(40+Object.keys(openWins).length*22))+'px';
    zTop+=1; el.style.zIndex=zTop;
    const tb = document.createElement('div');
    tb.className = 'win-titlebar';
    tb.innerHTML = `<span>${opts.icon||'🪟'}</span><span class="wt-title">${opts.title||''}</span>
      <div class="wt-btns"><div class="wt-min">–</div><div class="wt-max">□</div><div class="wt-close">✕</div></div>`;
    tb.querySelector('.wt-close').addEventListener('click', ()=>closeWin(id));
    tb.querySelector('.wt-min').addEventListener('click', ()=>{ el.style.display='none'; });
    tb.querySelector('.wt-max').addEventListener('click', ()=>{
      if(el.dataset.max==='1'){ el.style.width=(opts.width||560)+'px'; el.style.height=(opts.height||400)+'px'; el.dataset.max='0'; }
      else{ el.style.width='96%'; el.style.height='90%'; el.style.left='2%'; el.style.top='2%'; el.dataset.max='1'; }
    });
    const content = document.createElement('div');
    content.className = 'win-content';
    content.id = id+'-content';
    el.appendChild(tb); el.appendChild(content);
    el.addEventListener('mousedown', ()=>focusWin(id));
    layer.appendChild(el);
    makeDraggable(el, tb);
    openWins[id] = { el, title:opts.title, icon:opts.icon||'🪟' };
    if(opts.render) opts.render(content);
    return el;
  }

  function toast(msg, ms){
    const wrap = document.getElementById('toastWrap');
    const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
    wrap.appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, ms||3800);
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderTable(container, columns, rows, opts){
    opts = opts||{};
    container.innerHTML = `<table class="wtable"><thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r,ri)=>`<tr data-ri="${ri}">${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    if(opts.onRowClick){
      container.querySelectorAll('tbody tr').forEach(tr=>{
        tr.addEventListener('click', ()=>{
          container.querySelectorAll('tbody tr').forEach(x=>x.classList.remove('selected'));
          tr.classList.add('selected');
          opts.onRowClick(rows[parseInt(tr.dataset.ri)], tr);
        });
      });
    }
  }
  function openModal(html, wire){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-box">${html}</div>`;
    document.getElementById('appRoot').appendChild(overlay);
    if(wire) wire(overlay);
    return overlay;

  function recoveryCmdFlow(){
    winreEl.innerHTML = `<div style="width:640px;height:400px;background:#000;border:1px solid #444;"><div class="rcmd" id="rcmd-body"></div></div><div class="winre-back" data-back="advanced" style="margin-top:12px;">← Back</div>`;
    const body = winreEl.querySelector('#rcmd-body');
    function line(t){ const l=document.createElement('div'); l.className='rcmd-line'; l.textContent=t; body.appendChild(l); }
    line('Microsoft Windows [Version 10.0.22631]');
    line('X:\\Sources>');
    let buf='';
    const inputRow = document.createElement('div'); inputRow.className='rcmd-input-row';
    inputRow.innerHTML = `<span>X:\\Sources>&nbsp;</span><span id="rcmd-buf"></span><span class="rcmd-cursor"></span>`;
    body.appendChild(inputRow);
    const hidden = document.createElement('input'); hidden.style.position='absolute'; hidden.style.opacity='0';
    document.body.appendChild(hidden); hidden.focus();
    function refresh(){ inputRow.querySelector('#rcmd-buf').textContent = buf; body.scrollTop = body.scrollHeight; }
    async function run(cmd){
      inputRow.remove();
      line('X:\\Sources>'+cmd);
      const c = cmd.trim().toLowerCase();
      if(c==='bootrec /rebuildbcd'){
        line('Scanning all disks for Windows installations.'); await sleep(400);
        line('Please wait, since this may take a while...'); await sleep(500);
        line('Successfully scanned Windows installations.'); line('Total identified Windows installations: 1');
        line('[1] C:\\Windows'); line('Add installation to boot list? Yes(Y)/No(N)/All(A): Y'); await sleep(400);
        line('The operation completed successfully.');
      } else if(c==='bootrec /fixmbr'){
        await sleep(300); line('The operation completed successfully.');
      } else if(c==='bootrec /fixboot'){
        await sleep(300); line('The operation completed successfully.');
      } else if(c==='exit'){
        openWinRE('advanced'); return;
      } else if(c===''){
        // no-op
      } else {
        line(`'${cmd.split(' ')[0]}' is not recognized as an internal or external command.`);
      }
      body.appendChild(inputRow2()); hidden.focus();
    }
    function inputRow2(){
      const row = document.createElement('div'); row.className='rcmd-input-row';
      row.innerHTML = `<span>X:\\Sources>&nbsp;</span><span id="rcmd-buf"></span><span class="rcmd-cursor"></span>`;
      return row;
    }
    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
    hidden.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); const c=buf; buf=''; run(c); return; }
      if(e.key==='Backspace'){ buf=buf.slice(0,-1); refresh(); return; }
      if(e.key.length===1){ buf+=e.key; refresh(); }
    });
    winreEl.querySelector('[data-back]').onclick = ()=>{ hidden.remove(); openWinRE('advanced'); };
  }

    { group:'Part B — Performance and stability', name:'Degraded performance', action:'Task Manager → Processes / Performance', desc:'Use Task Manager (Processes tab and the 60-second Performance tab view) to identify resource-hogging apps. Also check Windows Update, free disk space, run defrag on an HDD, check the laptop power connection, and run an antivirus scan.', run:()=> openTaskManager('processes') },
    { group:'Part B — Performance and stability', name:'Low memory warnings', action:'Task Manager → Sort by Memory; Virtual Memory settings', desc:"Sort Task Manager by the Memory column to locate memory-draining programs; save files and close or restart them. Verify and manage the paging file under System > About > Advanced system settings > Performance Settings > Virtual Memory.", run:()=>{ openTaskManager('processes'); setTimeout(()=>{ tmState.sortMem='mem'; renderTaskManager(); },60); } },
    { group:'Part B — Performance and stability', name:'Frequent shutdowns', action:'Hardware diagnostics (UEFI) + Memory Diagnostic + sfc', desc:'Run full hardware diagnostics (motherboard, CPU, RAM) via UEFI/BIOS or motherboard tools, and Windows Memory Diagnostics. Check system file integrity with sfc and scan for malware. Unscheduled stops and app failures point to hardware diagnostics and integrity scans.', run: openMemDiag },
    { group:'Part B — Performance and stability', name:'System instability', action:'Hardware diagnostics + Memory Diagnostic + sfc + malware scan', desc:'Occurs randomly without warning. Troubleshoot with full hardware diagnostics via UEFI/BIOS or motherboard tools, Windows Memory Diagnostics, sfc (System File Checker), and an anti-malware scan.', run: openSecurity },
    { group:'Part B — Performance and stability', name:'Time drift', action:'Settings → Date & Time', desc:'Caused by hardware inaccurate timekeeping. Resolve via Settings > Time & Language > Date & Time — enable Set time automatically (and automatic DST adjustments) to sync with central time servers, or sync manually.', run: openDateTime },

    { group:'Part C — Services, applications, and peripherals', name:'Services not starting', action:'Device Manager + Services (services.msc) + sfc', desc:'Verify device status in Device Manager — update, roll back, or replace drivers. Open Services to attempt manual starts, adjust account authentication permissions, and verify dependencies. Run sfc for built-in services, or an admin reinstall for third-party app services.', run: openDeviceManager },
    { group:'Part C — Services, applications, and peripherals', name:'Applications crashing', action:'Event Viewer + Reliability Monitor', desc:'Inspect log entries in Event Viewer or use Reliability Monitor to identify failure causes and performance trends over time. Reinstall the failing application if necessary.', run: openReliability },
    { group:'Part C — Services, applications, and peripherals', name:'USB controller resource warnings', action:'Device Manager → USB Root Hub', desc:"This occurs when connecting devices that exceed the USB controller's available endpoints. Fix: disconnect the device and move it to a different USB port/controller, balancing USB 2.0 devices onto USB 2.0 controllers and USB 3.0 devices onto USB 3.0 controllers.", run:()=>{ openDeviceManager(); } },
    { group:'Part C — Services, applications, and peripherals', name:'Slow profile load', action:'Event Viewer → System log (slow logon event)', desc:'Typically caused by network latency or WAN congestion when syncing roaming user profiles to a remote domain controller. Domain administrators can resolve this by repairing or optimizing local domain controllers.', run:()=>{ openEventViewer(); } },
  ];
  function renderReference(filter){
    const list = document.getElementById('refList');
    list.innerHTML = '';
    const f = (filter||'').trim().toLowerCase();
    const items = reference.filter(r=> !f || r.name.toLowerCase().includes(f) || r.desc.toLowerCase().includes(f));
    if(items.length===0){ list.innerHTML = '<div class="ref-empty">No matching topics.</div>'; return; }
    let lastGroup = null;
    items.forEach(r=>{
      if(r.group!==lastGroup){ const g=document.createElement('div'); g.className='ref-group'; g.textContent=r.group; list.appendChild(g); lastGroup=r.group; }
      const item = document.createElement('div'); item.className='ref-item';
      item.innerHTML = `<div class="ref-name">${r.name}</div><div class="ref-action">${r.action}</div><div class="ref-desc">${r.desc}</div>`;
      item.addEventListener('click', ()=> r.run());
      list.appendChild(item);
    });
  }
  document.getElementById('refSearchInput').addEventListener('input', e=> renderReference(e.target.value));
  renderReference('');

  // ============== Expose API ==============
  window.Win = {
    toast, triggerBSOD, openTool, updateDriver, rollbackDriver, exitSafeMode,
    runOpen, runClose, runExecute,
  };

  // Boot
  openTaskManager();
})();
</script>
</body>
</html>
