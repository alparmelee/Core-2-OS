<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8 Final Test Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#17202B; --muted:#586577; --line:#D3D9E1;
  --accent:#2456D6; --accent-ink:#FFFFFF; --sel-bg:#E5ECFC;
  --ok:#17794F; --ok-bg:#E2F3EA; --bad:#B4372A; --bad-bg:#FBE9E6;
  --flag:#A86A00; --flag-bg:#FFF0CF; --term-bg:#141B24; --term-ink:#D8E3F0;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --panel:#171F29; --ink:#E6EBF2; --muted:#96A3B5; --line:#2A3543;
    --accent:#7BA0FF; --accent-ink:#0B1220; --sel-bg:#1D2B49;
    --ok:#5CCB94; --ok-bg:#12301F; --bad:#FF8D7B; --bad-bg:#37201C;
    --flag:#F0B450; --flag-bg:#332810; --term-bg:#0A0F15; --term-ink:#D8E3F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --panel:#171F29; --ink:#E6EBF2; --muted:#96A3B5; --line:#2A3543;
  --accent:#7BA0FF; --accent-ink:#0B1220; --sel-bg:#1D2B49;
  --ok:#5CCB94; --ok-bg:#12301F; --bad:#FF8D7B; --bad-bg:#37201C;
  --flag:#F0B450; --flag-bg:#332810; --term-bg:#0A0F15; --term-ink:#D8E3F0;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.55rem 1rem;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* start screen */
.start{max-width:760px;margin:0 auto;padding:48px 20px 64px}
.start h1{font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.02em;font-weight:700}
.start .kicker{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.82rem;color:var(--accent);margin:0 0 10px}
.start .kicker a{color:inherit;text-decoration:none}
.start .kicker a:hover{text-decoration:underline}
.start .lede{margin-top:14px;color:var(--muted);max-width:56ch}
.setup{margin-top:36px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
fieldset{border:0;margin:0 0 26px;padding:0}
legend{font-weight:700;margin-bottom:10px;padding:0}
.choices{display:grid;gap:10px}
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice .box{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.choice .box b{display:block}
.choice .box span{color:var(--muted);font-size:.93rem}
.choice input:checked + .box{border-color:var(--accent);background:var(--sel-bg)}
.choice input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;margin-bottom:24px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.best{margin-top:16px;color:var(--muted);font-size:.93rem}
.note{margin-top:28px;color:var(--muted);font-size:.9rem;max-width:62ch}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .title{font-weight:700;margin-right:auto}
.topbar .title small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;line-height:1.2}
.prog{color:var(--muted);font-size:.95rem}
.timer{font-family:var(--mono);font-weight:600;font-size:1.25rem;min-width:5.2ch;text-align:right}
.timer.low{color:var(--bad)}

/* shell */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1120px;margin:0 auto;padding:20px}
.qnav{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.navhead{font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nb{position:relative;min-height:40px;border:1.5px solid var(--line);background:var(--panel);border-radius:8px;font-weight:700;font-size:.9rem;padding:0}
.nb.pbq{border-style:dashed}
.nb.answered{background:var(--sel-bg);border-color:var(--accent)}
.nb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.nb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.nb.current{outline:3px solid var(--ink);outline-offset:1px}
.nb.flagged::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--flag) transparent transparent;border-top-right-radius:6px}
.legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend i.a{background:var(--sel-bg);border-color:var(--accent)}
.legend i.f{background:var(--flag);border-color:var(--flag)}
.legend i.p{border-style:dashed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;min-width:0}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.qnum{font-weight:700;font-size:1.05rem}
.tag{font-size:.82rem;font-weight:700;background:var(--sel-bg);color:var(--accent);padding:2px 10px;border-radius:99px}
.tag.pb{background:var(--flag-bg);color:var(--flag)}
.tag.diff-easy{background:var(--ok-bg);color:var(--ok)}
.tag.diff-medium{background:var(--flag-bg);color:var(--flag)}
.tag.diff-hard{background:var(--bad-bg);color:var(--bad)}
.qsrc{margin:-6px 0 18px;font-size:.92rem;max-width:72ch}
.qsrc a{color:var(--accent);font-weight:700;text-decoration:none}
.qsrc a:hover{text-decoration:underline}
.qsrc .where{color:var(--muted);font-weight:400}
.flagbtn{margin-left:auto;min-height:38px;padding:.3rem .8rem;font-size:.92rem}
.flagbtn[aria-pressed="true"]{background:var(--flag-bg);border-color:var(--flag);color:var(--flag)}
.qtext{white-space:pre-line;font-size:1.08rem;max-width:72ch;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.opt:hover{border-color:var(--accent)}
.opt .ltr{flex:none;width:30px;height:30px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;margin-top:-2px}
.opt.multi .ltr{border-radius:6px}
.opt .txt{flex:1;padding-top:1px}
.opt .badge{flex:none;font-size:.8rem;font-weight:700;padding-top:3px}
.opt.sel{background:var(--sel-bg);border-color:var(--accent)}
.opt.sel .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .ltr{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.correct .badge{color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.wrong .badge{color:var(--bad)}
.locked{pointer-events:none}

.term{display:flex;align-items:center;gap:10px;background:var(--term-bg);color:var(--term-ink);border-radius:10px;padding:14px 16px;font-family:var(--mono);max-width:640px}
.term .prompt{flex:none;opacity:.7}
.term input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font-family:var(--mono);font-size:1rem;outline:0;padding:4px 0}
.term:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.term.ok{outline:3px solid var(--ok)} .term.bad{outline:3px solid var(--bad)}
.solution{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);border:1px solid var(--ok);max-width:640px}
.solution code{font-family:var(--mono);font-weight:600;word-break:break-all}
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:640px}
.order li{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px 8px 12px;background:var(--panel)}
.order li.ok{border-color:var(--ok);background:var(--ok-bg)}
.order li.bad{border-color:var(--bad);background:var(--bad-bg)}
.order .pos{flex:none;width:28px;font-family:var(--mono);font-weight:600;color:var(--muted);text-align:right}
.order .txt{flex:1}
.order .mv{display:flex;gap:4px}
.order .mv button{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0;line-height:1}
.order .mv button:hover{border-color:var(--accent)}
.match{display:grid;gap:10px;max-width:760px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow.ok{border-color:var(--ok);background:var(--ok-bg)}
.mrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.mrow select{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;font-family:var(--mono);font-weight:600}
.mrow .ans{grid-column:1/-1;font-size:.9rem;color:var(--bad);font-weight:700}
.hint{color:var(--muted);font-size:.92rem;margin-bottom:12px}

.banner{margin-top:18px;padding:12px 14px;border-radius:10px;font-weight:700;max-width:72ch}
.banner.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.foot .sp{margin-left:auto}

/* results */
.results{max-width:900px;margin:0 auto;padding:36px 20px 64px}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.score .pct{font-size:clamp(3.2rem,12vw,5.5rem);font-weight:700;line-height:1;letter-spacing:-.03em}
.score p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:26px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.filters .btn{min-height:40px;padding:.3rem .9rem}
.filters .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{background:var(--panel);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:20px;margin-bottom:14px}
.rev.ok{border-left-color:var(--ok)} .rev.bad{border-left-color:var(--bad)} .rev.na{border-left-color:var(--flag)}
.rev .qmeta{margin-bottom:10px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.na{color:var(--flag)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:440px;width:100%}
.modal h2{font-size:1.3rem;margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:20px}
.modal .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;padding:12px}
  .qnav{position:static;order:2}
  .grid{grid-template-columns:repeat(8,1fr)}
  .card{padding:18px}
  .topbar{padding:8px 12px}
  .mrow{grid-template-columns:1fr}
}
@media (max-width:420px){ .grid{grid-template-columns:repeat(6,1fr)} }
@media (prefers-reduced-motion:no-preference){
  .opt,.nb,.btn{transition:background-color .12s,border-color .12s}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- DATA ---------- */
const MC_RAW = [
["A6","A system administrator is installing a new server into the metal racks in a data center. During the installation process, the administrator can feel a faint tingling sensation when mounting the server. Which of the following safety systems should be tested and verified first?",["Equipment grounding","Air filtration","Cable management","Waste disposal regulations"],"A"],
["A7","A user has opened a help desk ticket regarding the battery life on their mobile phone. The battery in the phone held a charge for most of the day prior to connecting to the corporate network. The battery now only lasts about half a day and the back of the phone is warmer than usual. The phone is configured as follows:\nStorage: 216.2 GB of 512 GB used\nDisplay and Brightness: Automatic\nWi-Fi: Enabled\nAuto-lock: Disabled\nVPN: Not connected\nLow Power Mode: Disabled\nBattery Maximum Capacity: 100%\n\nWhich of the following changes would have the best impact on battery performance?",["Enable auto-lock","Connect to the VPN","Increase available storage space","Disable Wi-Fi"],"A"],
["A8","A user in the accounting department is trying to install an app on their new corporate mobile phone, but the installation fails each time. Which of the following would be the most likely reason for this issue?",["Incorrect file system type","MDM policy restriction","Slow CPU speeds","Low battery level"],"B"],
["A9","A system administrator has required the use of FRT for authentication on all laptops, mobile phones, and tablets. Which of the following will be required to meet this requirement?",["Fingerprint reader","Badge reader","Token generator","Integrated camera"],"D"],
["A10","A desktop technician is cleaning the outside of computers used on a manufacturing assembly line. The assembly line creates sawdust and wood chips, so most of the computers are protected with enclosed computer cases. Which of the following would be the most important item for the technician to include during this cleaning process?",["Surge suppressor","Temperature sensor","Air filter mask","ESD mat"],"C"],
["A11","After a user authenticates to a web site, the browser performs very slowly and some of the items on the page will not properly display. Which of the following would be the best way to resolve this issue?",["Disable browser notifications","Update the web server certificate","Update the system BIOS","Clear the browser cache"],"D"],
["A12","The motherboard of a server in the corporate data center has started smoking, and flames can be seen inside the computer case. Which of the following would be the best way to extinguish this fire?",["Water hose","Foam-based extinguisher","Disconnect the power","Carbon dioxide extinguisher"],"D"],
["A13","Which of these Windows features provides full disk encryption for all data on a storage drive?",["Domain Services","EFS","RDP","BitLocker"],"D"],
["A14","A company maintains data retention requirements of five years for all customer names, addresses, and phone numbers. Which of the following would best describe this data?",["Credit card transactions","Government-issued information","PII","Healthcare data"],"C"],
["A15","A user in the accounting department would like to ensure their mobile device data is always available. If the user's smartphone is damaged or stolen, they would like to replace the device and restore all data as quickly as possible. Which of the following would provide this functionality?",["Full device encryption","Remote backup","IoT isolation","Remote wipe"],"B"],
["A16","Each time a user starts a specific corporate application, a page of disclaimers and usage requirements is shown before the login prompt. Which of the following would best describe this page?",["Splash screen","Acceptable use policy","Standard operating procedures","Topology diagram"],"A"],
["A17","A system administrator is troubleshooting an older application on a Windows computer and needs to modify the UAC process. Which of the following options would provide access to these settings?",["Device Manager","System Information","Event Viewer","User Accounts"],"D"],
["A18","An office power system occasionally experiences minor voltage spikes during the business day. Which of the following would be the best way to address this power issue?",["Power down when not actively working","Confirm the building has an electrical ground","Connect a surge suppressor to each system","Maintain an inventory of replacement power supplies"],"C"],
["A19","What is the maximum amount of RAM supported by a 32-bit version of an operating system?",["4 GB","8 GB","16 GB","192 GB"],"A"],
["A20","A user is attempting to start an application on his laptop computer. Each time the application shows the starting graphic, it suddenly disappears and the application icon disappears from the taskbar. A technician would like to get more information about each previous occurrence of the application crash. Which of these choices would provide these details?",["Event Viewer","Task Manager","Startup Repair","Safe Mode"],"A"],
["A21","An attacker is using every combination of letters, numbers, and special characters in an attempt to discover a user's password. Which of the following would describe this attack type?",["Spoofing","Social engineering","Brute force attack","DDoS"],"C"],
["A22","A system administrator is upgrading an email service in the corporate data center. During the upgrade, an error message appears and the upgrade fails. Subsequent attempts to perform the upgrade also fail. Which of the following processes should the system administrator follow to return the email server to its previous state?",["Rollback plan","Disaster recovery plan","Incident response plan","Power plan"],"A"],
["A23","When connecting a new USB webcam to Windows 11, a message appears stating “The controller does not have enough resources for this device.” Which of the following would be the best next troubleshooting step?",["Close all large-memory processes","Modify the BCD","Move the webcam to a different USB interface","Use System Restore to rollback to a previous configuration"],"C"],
["A24","A system administrator has created a shared folder on a server to store operating system images. Technicians access the shared folder to download the latest images when performing large-scale system installations. Which of the following will be the most likely method of accessing this data?",["Map the shared folder to an available drive letter","Download the shared folder through a proxy","Link the images to a cloud storage service","Access the folder using a remote access client"],"A"],
["A25","A system administrator is installing a Windows Server device in the data center. Which of the following file systems would be the best choice for this task?",["ReFS","APFS","ext4","XFS"],"A"],
["A26","A security technician has identified malware running in the OS kernel. Traditional anti-malware scans were not able to identify any problems on the computer. Which of the following would be the best description of this malware?",["Rootkit","Worm","Botnet","Cryptominer"],"A"],
["A27","A help desk technician has been called to a training room with Android tablets as presentation devices. An application used during the training program will not start on any of the tablets. When the application is selected, the splash screen appears for a moment and then completely disappears with no error message. Which of the following would be the best next troubleshooting step?",["Install all operating system updates","Uninstall the application","Power cycle the tablets","Roll back to the previous application version"],"C"],
["A28","A user on the headquarters network has opened a help desk ticket about their Windows desktop. When starting their computer, the login process proceeds normally but the Windows desktop takes fifteen minutes to appear. Yesterday, the desktop appeared in just a few seconds. Which of the following would be the most likely reason for this issue?",["Slow profile load","Incorrect boot device order","Faulty RAM","Incorrect username and password"],"A"],
["A29","A system administrator has been asked to install a new application on a server, but the application is 64-bit and the server operating system is 32-bit. Which of the following describes the issue associated with this installation?",["File permissions","OS compatibility","Installation method","Available drive space"],"B"],
["A30","A security guard has reported a person passing through a secure door without using a door badge. The intruder slipped through the door by closely following the person in front of them. Which of these would best describe these actions?",["Dumpster diving","Brute force","Phishing","Tailgating"],"D"],
["A31","A Linux administrator needs to modify the configuration text file for a service. Which of the following utilities would provide this functionality?",["nano","chmod","df","sudo"],"A"],
["A32","An internal audit has found a server in the DMZ which appears to be infected with malware. The malware does not appear to be part of a file in the OS, and the malware runs each time the system is started. What type of malware would be most likely found on this server?",["Trojan","Ransomware","Keylogger","Spyware","Boot sector virus"],"E"],
["A33","A user has delivered a broken laptop to the help desk, and they are visibly upset and quite vocal about the problem they're having. The user is also asking for a very specific repair which doesn't appear to have any relationship to his issue. What's the best way to handle this situation?",["Repeat your understanding of the issue to the customer and provide an estimate and follow-up time","Refuse the repair until the customer calms down","Inform the customer of his mistake with the proposed repair","Refuse to make any commitments until the computer is examined"],"A"],
["A34","A user in the finance department has purchased a new Android smartphone and has installed a number of productivity apps. After a day of use, the phone is displaying a large number of advertisements when browsing the Internet. Which of the following tasks should the user perform after completing a factory reset?",["Disable Bluetooth","Check app sharing permissions","Run a speed test on the cellular connection","Verify the source of each app before installation"],"D"],
["A35","When making configuration changes, a technician is assigned a temporary administrator password to use for the duration of the update. Once the administrator credentials are used, they are automatically deleted. Which of the following would best describe this process?",["Single sign-on","Data loss prevention","User Access Console","Just-in-time access"],"D"],
["A36","A user has been provided with a username and password for accessing the corporate VPN. The user has also been provided with a hardware device displaying a six digit code, and the code changes every 30 seconds. Which of the following would best describe the use of this device?",["ACL","Group Policy","SMS","Least privilege","MFA"],"E"],
["A37","A user has installed multiple applications over the last week. During the startup process, the computer now takes over fifteen minutes to display the Windows desktop. Which of the following utilities would help the system administrator troubleshoot this issue?",["defrag","Performance Monitor","Task Manager","robocopy"],"C"],
["A38","A server administrator is replacing the memory in a database server. Which of the following steps should be followed first?",["Remove the existing memory modules","Wear an air filter mask","Disconnect all power sources","Connect an ESD strap"],"C"],
["A39","A technician is dismantling a test lab for a recently completed project, and the lab manager would like to use the existing computers on a new project. However, the security administrator would like to ensure none of the data from the previous project is accessible on the existing hard drives. Which of the following would be the best way to accomplish this?",["Quick format","Degauss","Regular format","Reinstall the operating system"],"C"],
["A40","A system administrator needs to view a set of application log files contained in a folder named “logs.” Which of the following commands should be used to make this folder the current directory?",["cd logs","mv logs","dir logs","md logs"],"A"],

  return `<p class="qsrc"><a href="${esc(href)}" target="_blank" rel="noopener">Study ${esc(it.unit)}</a>${it.loc?` <span class="where">— ${esc(it.loc)}</span>`:""}</p>`;
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmt = ms => {const s=Math.max(0,Math.round(ms/1000));const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");};
let S=null, timerId=null;

const LENGTHS = {
  full:{label:"Full exam",pbq:4,mc:85,min:90},
  short:{label:"Short exam",pbq:2,mc:28,min:30},
  quick:{label:"Quick quiz",pbq:0,mc:10,min:10}
};

function loadBest(){try{return JSON.parse(localStorage.getItem("examA-best")||"{}");}catch(e){return {};}}
function saveBest(len,pct){try{const b=loadBest();if(b[len]==null||pct>b[len]){b[len]=pct;localStorage.setItem("examA-best",JSON.stringify(b));}}catch(e){}}

/* ---------- START SCREEN ---------- */
function renderStart(){
  clearInterval(timerId); S=null;
  const best=loadBest();
  const bestTxt=Object.keys(best).map(k=>LENGTHS[k].label+": "+best[k]+"%").join(" | ");
  app.innerHTML=`
  <div class="start">
    <p class="kicker"><a href="index.html">Core 2</a> · Chapter 8</p>
    <h1>Final Test Review</h1>
    <p class="lede">Full Core 2 practice exam — operating systems, security, software troubleshooting, and operational procedures. Four performance-based questions come first, then multiple choice, like the real thing.</p>
    <form class="setup" id="setup">
      <fieldset>
        <legend>Mode</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="mode" value="exam" checked><span class="box"><b>Exam simulation</b><span>No feedback until you finish. Flag questions and come back to them.</span></span></label>
          <label class="choice"><input type="radio" name="mode" value="study"><span class="box"><b>Study mode</b><span>Check each answer as you go and see the correct one right away.</span></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Length</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="len" value="full" checked><span class="box"><b>Full exam: 89 questions</b><span>4 performance-based, 85 multiple choice. 90 minutes.</span></span></label>
          <label class="choice"><input type="radio" name="len" value="short"><span class="box"><b>Short exam: 30 questions</b><span>2 performance-based, 28 multiple choice. 30 minutes.</span></span></label>
          <label class="choice"><input type="radio" name="len" value="quick"><span class="box"><b>Quick quiz: 10 questions</b><span>10 random multiple choice. 10 minutes.</span></span></label>
        </div>
      </fieldset>
      <label class="check" id="timedRow"><input type="checkbox" id="timed" checked><span>Use the time limit (exam simulation only)</span></label>
      <button class="btn primary" type="submit">Start</button>
      ${bestTxt?`<p class="best">Best scores on this device: ${esc(bestTxt)}</p>`:""}
    </form>
    <p class="note">Multiple-choice questions are shuffled each attempt. Questions that need a screenshot in the original document (the last performance-based item) are left out. In study mode, each question links to the unit where that topic lives.</p>
  </div>`;
  const form=document.getElementById("setup");
  const syncTimed=()=>{const m=form.mode.value;const row=document.getElementById("timedRow");row.style.display=m==="exam"?"flex":"none";};
  form.addEventListener("change",syncTimed);syncTimed();
  form.addEventListener("submit",e=>{
    e.preventDefault();
    const L=LENGTHS[form.len.value], mode=form.mode.value;
    let pbq=[];
    if(L.pbq===4) pbq=[...PBQ];
    else if(L.pbq>0) pbq=shuffle(PBQ).slice(0,L.pbq).sort((a,b)=>PBQ.indexOf(a)-PBQ.indexOf(b));
    const mc=shuffle(MC).slice(0,L.mc);
    const timed=mode==="exam"&&document.getElementById("timed").checked;
    begin([...pbq,...mc],mode,timed?L.min:0,form.len.value);
  });
}

/* ---------- SESSION ---------- */
function begin(items,mode,minutes,len){
  clearInterval(timerId);
  S={mode,items,idx:0,ans:{},flags:new Set(),checked:{},orderInit:{},startAt:Date.now(),
     endAt:minutes?Date.now()+minutes*60000:null,len:len||null,done:false,filter:"all"};
  items.forEach(it=>{
    if(it.kind==="order"){let s;do{s=shuffle(it.answer);}while(s.join("|")===it.answer.join("|"));S.orderInit[it.id]=s;}
  });
  renderQuiz();
  if(S.endAt){timerId=setInterval(tick,1000);}
  window.scrollTo(0,0);
}
function tick(){
  if(!S||S.done||!S.endAt)return;
  const rem=S.endAt-Date.now();
  const el=document.getElementById("timer");
  if(el){el.textContent=fmt(rem);el.classList.toggle("low",rem<5*60000);}
  if(rem<=0)finish();
}
const isAnswered=it=>{
  const a=S.ans[it.id];
  if(it.kind==="mc")return !!(a&&a.length);
  if(it.kind==="cmd")return !!(a&&a.trim());
  if(it.kind==="order")return !!a;
  if(it.kind==="match")return !!(a&&a.some(Boolean));
};
const isCorrect=it=>{
  const a=S.ans[it.id]; if(!isAnswered(it))return false;
  if(it.kind==="mc")return a.length===it.a.length&&[...a].sort().join()===[...it.a].sort().join();
  if(it.kind==="cmd")return it.check(norm(a));
  if(it.kind==="order")return a.join("|")===it.answer.join("|");
  if(it.kind==="match")return it.rows.every((r,i)=>a[i]===r.a);
};
const kindLabel=it=>it.kind==="mc"?"":"Performance-based";

/* ---------- QUIZ VIEW ---------- */
function renderQuiz(){
  const modeLabel=S.mode==="exam"?"Exam simulation":"Study mode";
  app.innerHTML=`
  <div class="topbar">
    <div class="title">8 Final Test Review<small>${modeLabel}</small></div>
    <div class="prog" id="prog"></div>
    ${S.endAt?`<div class="timer" id="timer" aria-label="Time remaining">${fmt(S.endAt-Date.now())}</div>`:""}
    <button class="btn" data-act="finish">Finish</button>
  </div>
  <div class="shell">
    <nav class="qnav" aria-label="Question navigator">
      <div class="navhead">Questions</div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i class="a"></i>Answered</span><span><i class="f"></i>Flagged</span><span><i class="p"></i>Performance-based</span></div>
    </nav>
    <main class="card" id="qcard"></main>
  </div>`;
  renderNav();renderCard();
}
function renderNav(){
  const g=document.getElementById("grid"); if(!g)return;
  g.innerHTML=S.items.map((it,i)=>{
    let c="nb";
    if(it.kind!=="mc")c+=" pbq";
    if(S.mode==="study"&&S.checked[it.id])c+=isCorrect(it)?" ok":" bad";
    else if(isAnswered(it))c+=" answered";
    if(S.flags.has(it.id))c+=" flagged";
    if(i===S.idx)c+=" current";
    return `<button class="${c}" data-act="goto" data-i="${i}" aria-label="Question ${i+1}${isAnswered(it)?", answered":""}${S.flags.has(it.id)?", flagged":""}"${i===S.idx?' aria-current="true"':""}>${i+1}</button>`;
  }).join("");
  const n=S.items.filter(isAnswered).length;
  document.getElementById("prog").textContent=`Question ${S.idx+1} of ${S.items.length}  |  ${n} answered`;
}

function itemBody(it,{reveal,locked}){
  const a=S.ans[it.id];
  const lk=locked?" locked":"";
  if(it.kind==="mc"){
    const multi=it.a.length>1, sel=a||[];
    return `<div class="opts${lk}" role="${multi?"group":"radiogroup"}" aria-label="Answer choices">`+it.o.map((t,i)=>{
      const s=sel.includes(i);let c="opt"+(multi?" multi":"")+(s?" sel":"");let b="";
      if(reveal){if(it.a.includes(i)){c+=" correct";b=s?"Correct, your answer":"Correct answer";}else if(s){c+=" wrong";b="Your answer";}}
      return `<button type="button" class="${c}" data-act="opt" data-i="${i}" role="${multi?"checkbox":"radio"}" aria-checked="${s}"><span class="ltr">${LET[i]}</span><span class="txt">${esc(t)}</span>${b?`<span class="badge">${b}</span>`:""}</button>`;
    }).join("")+`</div>`;
  }
  if(it.kind==="cmd"){
    const ok=reveal&&isCorrect(it);
    return `<p class="hint">Type the command and press Enter or use the navigator to move on.</p>
    <div class="term${reveal?(ok?" ok":" bad"):""}"><span class="prompt">C:\\&gt;</span><input type="text" data-act="cmd" value="${esc(a||"")}" ${locked?"readonly":""} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command line"></div>
    ${reveal?`<div class="solution">Accepted answer: <code>${esc(it.solution)}</code></div>`:""}`;
  }
  if(it.kind==="order"){
    const list=a||S.orderInit[it.id];
    return `<p class="hint">Use the arrows to put the steps in order. Step 1 happens first.</p>
    <ol class="order">${list.map((t,i)=>{
      let c="";if(reveal)c=t===it.answer[i]?"ok":"bad";
      return `<li class="${c}"><span class="pos">${i+1}</span><span class="txt">${esc(t)}</span>${locked?"":`<span class="mv"><button type="button" data-act="up" data-i="${i}" aria-label="Move up: ${esc(t)}"${i===0?" disabled":""}>&#9650;</button><button type="button" data-act="down" data-i="${i}" aria-label="Move down: ${esc(t)}"${i===list.length-1?" disabled":""}>&#9660;</button></span>`}</li>`;
    }).join("")}</ol>
    ${reveal&&!isCorrect(it)?`<div class="solution"><b>Correct order</b><ol style="margin:8px 0 0;padding-left:22px">${it.answer.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`:""}`;
  }
  if(it.kind==="match"){
    const cur=a||[];
    return `<p class="hint">Pick one term for each description. Some terms will not be used.</p>
    <div class="match">${it.rows.map((r,i)=>{
      const v=cur[i]||"";let c="mrow";if(reveal)c+=v===r.a?" ok":" bad";
      return `<div class="${c}"><div>${esc(r.d)}</div><select data-act="sel" data-i="${i}" ${locked?"disabled":""} aria-label="Term for: ${esc(r.d)}"><option value="">Select</option>${it.terms.map(t=>`<option value="${t}"${v===t?" selected":""}>${t}</option>`).join("")}</select>${reveal&&v!==r.a?`<div class="ans">Correct answer: ${r.a}</div>`:""}</div>`;
    }).join("")}</div>`;
  }
}

function renderCard(focusSel){
  const it=S.items[S.idx], reveal=S.mode==="study"&&!!S.checked[it.id];
  const last=S.idx===S.items.length-1;
  const flagged=S.flags.has(it.id);
  let banner="";
  if(reveal){
    const ok=isCorrect(it);
    let t=ok?"Correct.":"Not quite.";
    if(!ok&&it.kind==="mc")t+=" The correct answer"+(it.a.length>1?"s are ":" is ")+it.a.map(i=>LET[i]).join(" and ")+".";
    banner=`<div class="banner ${ok?"ok":"bad"}" role="status">${t}</div>`;
  }
  document.getElementById("qcard").innerHTML=`
    <div class="qmeta">
      <span class="qnum">Question ${S.idx+1}</span>
      ${it.diff?`<span class="tag diff-${esc(it.diff)}">${diffLabel(it.diff)}</span>`:""}
      ${it.kind!=="mc"?`<span class="tag pb">Performance-based</span>`:(it.a.length>1?`<span class="tag">Choose ${it.a.length}</span>`:"")}
      <button class="btn ghost flagbtn" data-act="flag" aria-pressed="${flagged}">${flagged?"Flagged for review":"Flag for review"}</button>
    </div>
    <div class="qtext">${esc(it.q)}</div>
    ${S.mode==="study"?sourceLine(it):""}
    ${itemBody(it,{reveal,locked:reveal})}
    ${banner}
    <div class="foot">
      <button class="btn" data-act="prev"${S.idx===0?" disabled":""}>Previous</button>
      ${S.mode==="study"&&!reveal?`<button class="btn primary" data-act="check"${isAnswered(it)?"":" disabled"}>Check answer</button>`:""}
      <button class="btn ${last?"primary":""} sp" data-act="${last?"finish":"next"}">${last?"Finish":"Next"}</button>
    </div>`;
  if(focusSel){const el=document.querySelector(focusSel);if(el)el.focus();}
}
function syncCheckBtn(){
  const b=document.querySelector('[data-act="check"]');
  if(b)b.disabled=!isAnswered(S.items[S.idx]);
}

/* ---------- INTERACTION ---------- */
function go(i){if(i<0||i>=S.items.length)return;S.idx=i;renderNav();renderCard();window.scrollTo({top:0});}
function toggleOpt(i){
  const it=S.items[S.idx];
  if(it.kind!=="mc"||(S.mode==="study"&&S.checked[it.id]))return;
  let a=[...(S.ans[it.id]||[])];
  if(it.a.length>1){
    if(a.includes(i))a=a.filter(x=>x!==i);else{a.push(i);if(a.length>it.a.length)a.shift();}
  }else a=[i];
  S.ans[it.id]=a;
  document.querySelectorAll("#qcard .opt").forEach((el,k)=>{
    const s=a.includes(k);el.classList.toggle("sel",s);el.setAttribute("aria-checked",s);
  });
  renderNav();syncCheckBtn();
}
function moveOrder(i,d){
  const it=S.items[S.idx];
  const list=[...(S.ans[it.id]||S.orderInit[it.id])];
  const j=i+d;if(j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];
  S.ans[it.id]=list;
  renderCard(`[data-act="${d<0?"up":"down"}"][data-i="${j}"]:not([disabled])`);
  if(!document.activeElement||document.activeElement===document.body)renderCard();
  renderNav();
}
app.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const act=t.dataset.act;
  if(!S&&act!=="x")return;
  if(S&&S.done)return;
  if(act==="opt")toggleOpt(+t.dataset.i);
  else if(act==="goto")go(+t.dataset.i);
  else if(act==="prev")go(S.idx-1);
  else if(act==="next")go(S.idx+1);
  else if(act==="up")moveOrder(+t.dataset.i,-1);
  else if(act==="down")moveOrder(+t.dataset.i,1);
  else if(act==="flag"){const id=S.items[S.idx].id;S.flags.has(id)?S.flags.delete(id):S.flags.add(id);renderNav();renderCard(`[data-act="flag"]`);}
  else if(act==="check"){const id=S.items[S.idx].id;S.checked[id]=true;renderNav();renderCard();}
  else if(act==="finish")confirmFinish();
});
app.addEventListener("input",e=>{
  if(!S||S.done)return;
  const t=e.target;
  if(t.dataset.act==="cmd"){S.ans[S.items[S.idx].id]=t.value;renderNav();syncCheckBtn();}
});
app.addEventListener("change",e=>{
  if(!S||S.done)return;
  const t=e.target;
  if(t.dataset.act==="sel"){
    const it=S.items[S.idx];
    const a=S.ans[it.id]||new Array(it.rows.length).fill("");
    a[+t.dataset.i]=t.value;S.ans[it.id]=a;renderNav();syncCheckBtn();
  }
});
app.addEventListener("keydown",e=>{
  if(e.target.dataset&&e.target.dataset.act==="cmd"&&e.key==="Enter"){e.preventDefault();
    if(S.mode==="study"&&!S.checked[S.items[S.idx].id]&&isAnswered(S.items[S.idx])){S.checked[S.items[S.idx].id]=true;renderNav();renderCard();}
    else go(S.idx+1);}
});
document.addEventListener("keydown",e=>{
  if(!S||S.done||document.querySelector(".scrim"))return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea"||e.ctrlKey||e.metaKey||e.altKey)return;
  const it=S.items[S.idx];
  if(e.key==="ArrowRight")go(S.idx+1);
  else if(e.key==="ArrowLeft")go(S.idx-1);
  else if(it.kind==="mc"&&/^[a-g]$/i.test(e.key)){const i=e.key.toLowerCase().charCodeAt(0)-97;if(i<it.o.length)toggleOpt(i);}
});

/* ---------- FINISH ---------- */
function confirmFinish(){
  const un=S.items.filter(it=>!isAnswered(it)).length, fl=S.flags.size;
  const bits=[];
  if(un)bits.push(`${un} unanswered`);
  if(fl)bits.push(`${fl} flagged for review`);
  const s=document.createElement("div");
  s.className="scrim";
  s.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">Finish and see your score?</h2>
    <p>${bits.length?"You still have "+bits.join(" and ")+". ":""}You can't change answers after you finish.</p>
    <div class="row"><button class="btn" id="mc">Keep working</button><button class="btn primary" id="mf">Finish and score</button></div></div>`;
  document.body.appendChild(s);
  const close=()=>s.remove();
  s.querySelector("#mc").onclick=close;
  s.querySelector("#mf").onclick=()=>{close();finish();};
  s.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
  s.querySelector("#mf").focus();
}
function finish(){
  if(!S||S.done)return;
  clearInterval(timerId);
  document.querySelectorAll(".scrim").forEach(x=>x.remove());
  S.done=true;S.endedAt=Date.now();
  const correct=S.items.filter(isCorrect).length;
  S.pct=Math.round(correct/S.items.length*100);
  if(S.len)saveBest(S.len,S.pct);
  renderResults();
  window.scrollTo(0,0);
}

/* ---------- RESULTS ---------- */
function renderResults(){
  const items=S.items, total=items.length;
  const correct=items.filter(isCorrect);
  const unans=items.filter(it=>!isAnswered(it));
  const wrong=items.filter(it=>isAnswered(it)&&!isCorrect(it));
  const pb=items.filter(it=>it.kind!=="mc"), mcs=items.filter(it=>it.kind==="mc");
  const used=fmt(Math.min(S.endedAt-S.startAt,S.endAt?S.endAt-S.startAt:Infinity));
  const missed=[...wrong,...unans];
  app.innerHTML=`
  <div class="results">
    <div class="score"><div class="pct">${S.pct}%</div><p>${correct.length} of ${total} correct</p></div>
    <div class="stats">
      <div class="stat"><b>${correct.length}</b><span>Correct</span></div>
      <div class="stat"><b>${wrong.length}</b><span>Incorrect</span></div>
      <div class="stat"><b>${unans.length}</b><span>Unanswered</span></div>
      ${pb.length?`<div class="stat"><b>${pb.filter(isCorrect).length} / ${pb.length}</b><span>Performance-based</span></div>`:""}
      <div class="stat"><b>${mcs.filter(isCorrect).length} / ${mcs.length}</b><span>Multiple choice</span></div>
      <div class="stat"><b>${used}</b><span>Time used</span></div>
    </div>
    <div class="actions">
      ${missed.length?`<button class="btn primary" id="again">Practice ${missed.length} missed question${missed.length===1?"":"s"}</button>`:""}
      <button class="btn" id="new">New exam</button>
    </div>
    <h2>Review</h2>
    <div class="filters" role="group" aria-label="Filter review">
      ${[["all","All ("+total+")"],["bad","Incorrect ("+wrong.length+")"],["na","Unanswered ("+unans.length+")"],["flag","Flagged ("+S.flags.size+")"]].map(([k,l])=>`<button class="btn" data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}
    </div>
    <div id="review"></div>
  </div>`;
  document.getElementById("new").onclick=renderStart;
  const ag=document.getElementById("again");
  if(ag)ag.onclick=()=>begin(missed.map(m=>m),"study",0,null);
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderReview();});
  renderReview();
}
function renderReview(){
  const list=S.items.map((it,i)=>({it,i})).filter(({it})=>{
    const f=S.filter;
    if(f==="all")return true;
    if(f==="bad")return isAnswered(it)&&!isCorrect(it);
    if(f==="na")return !isAnswered(it);
    if(f==="flag")return S.flags.has(it.id);
  });
  const box=document.getElementById("review");
  if(!list.length){box.innerHTML=`<div class="empty">Nothing here. Try a different filter.</div>`;return;}
  box.innerHTML=list.map(({it,i})=>{
    const ok=isCorrect(it), na=!isAnswered(it);
    const cls=ok?"ok":na?"na":"bad", v=ok?"Correct":na?"Not answered":"Incorrect";
    return `<article class="rev ${cls}">
      <div class="qmeta"><span class="qnum">Question ${i+1}</span>${it.diff?`<span class="tag diff-${esc(it.diff)}">${diffLabel(it.diff)}</span>`:""}<span class="verdict ${cls}">${v}</span>${it.kind!=="mc"?`<span class="tag pb">Performance-based</span>`:""}${S.flags.has(it.id)?`<span class="tag pb">Flagged</span>`:""}</div>
      <div class="qtext">${esc(it.q)}</div>
      ${sourceLine(it)}
      ${itemBody(it,{reveal:true,locked:true})}
    </article>`;
  }).join("");
}

renderStart();
</script>
</body>
